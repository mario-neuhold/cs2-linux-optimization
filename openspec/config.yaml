strict_tdd: false
context: |
  cs2-optimization is a Linux system optimization project for Counter-Strike 2 gaming performance.
  No traditional build tool. Artifacts: shell scripts (.sh), system config files (/etc/, /sys/, ~/.config/),
  Steam launch options, CS2 autoexec.cfg.
  Hardware: Intel i5-10300H (4c/8t), 14GB RAM, NVIDIA GTX 1650 Mobile (4GB), Intel UHD integrated.
  OS: Linux kernel 7.0.0-22-generic, Wayland session. Steam installed. Gamemode NOT installed. prime-run NOT available.
